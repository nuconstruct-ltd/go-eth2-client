name: revive
on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:
  revive:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-22.04' || 'amd64-spot' }}
    steps:
      - uses: actions/setup-go@v5
        with:
          cache: false
          go-version: '1.25.2'
      - uses: actions/checkout@v4
      - uses: morphy2k/revive-action@v2
